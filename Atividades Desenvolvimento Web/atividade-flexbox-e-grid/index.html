<!doctype html>
<html lang="pt-bt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galeria</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
        <h1>Galeria: <i>Atividade</i></h1>
    </header>
    


    <div class="grid-container">
      <div class="bloco-video">
        <figure>
        <h2>Calamitas Clone</h2>
        
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/ygbEkD5H0bg?si=oQjCThD6eKVKiHH9"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <figcaption>Boss fight contra Calamitas Clone</figcaption>
        </figure>
      </div>
    <div class="bloco-img">
        <figure>
        <img src="imgs/image.png" alt="" />
        <figcaption>Pixelart Calamitas Clone</figcaption>
    </div>
        
        </figure>


      <div class="bloco">
        <figure>
        <audio controls src="audios/WhatsApp Audio 2026-10-01 at 18.45.45(1).mp3"></audio>
        <figcaption>Música bossfight Calamitas Clone</figcaption>    
        </figure>
    </div>



      <div class="bloco-video">
        <figure>
        <h2>Supreme Calamitas</h2>
        
        <iframe
          width="560"
          height="315"
          src="https://www.youtube.com/embed/wO314rgquXs?si=I6-XX92J8SG5JMj2"
          title="YouTube video player"
          frameborder="0"
          allow="
            accelerometer;
            autoplay;
            clipboard-write;
            encrypted-media;
            gyroscope;
            picture-in-picture;
            web-share;
          "
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
        <figcaption>Boss fight contra Supreme Calamitas</figcaption>
        </figure>
      </div>
      <div class="bloco-img">
        <figure>
        <img src="imgs/image2.png" alt="" />
        <figcaption>Pixelart Supreme Calamitas</figcaption>
        </figure>
    </div>

      <div class="bloco">
        
        <figure>
        <audio controls src="audios/WhatsApp Audio 2026-10-01 at 18.45.45.mp3"></audio>
        <figcaption>Música da bossfight Supreme Calamitas</figcaption>
        </figure>
        
      </div>
      
    </div>
  </body>
</html>
